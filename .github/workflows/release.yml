name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          cache: true
          install: true
      - name: Install locked dependencies
        run: mise exec -- uv sync --frozen
      - name: Quality gate
        run: mise exec -- uv run pytest --cov=rojo_mapper --cov-branch --cov-report=term-missing
      - name: Restore compiler cache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: nuitka-ccache-${{ matrix.platform }}-${{ hashFiles('uv.lock', 'mise.lock') }}
          max-size: 2G
      - name: Restore Nuitka cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.nuitka-cache
          key: nuitka-cache-${{ matrix.platform }}-${{ hashFiles('uv.lock', 'mise.lock') }}
          restore-keys: |
            nuitka-cache-${{ matrix.platform }}-
      - name: Build and smoke standalone archive
        run: mise exec -- uv run python scripts/build_release.py
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/rmp-v*"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rmp-${{ matrix.platform }}
          path: dist/rmp-v*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-tags: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rmp-*
          path: dist
          merge-multiple: true
      - name: Create combined SHA-256 manifest
        working-directory: dist
        run: sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Publish generated-notes release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
