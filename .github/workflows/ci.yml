name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          cache: true
          install: true
      - name: Install locked dependencies
        run: mise exec -- uv sync --frozen
      - name: Ruff format
        run: mise exec -- uv run ruff format --check .
      - name: Ruff lint
        run: mise exec -- uv run ruff check .
      - name: Strict Pyright
        run: mise exec -- uv run pyright
      - name: Tests and branch coverage
        run: mise exec -- uv run pytest --cov=rojo_mapper --cov-branch --cov-report=term-missing
